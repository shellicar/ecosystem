name: Setup workspace
description: >
  Turn off exclude-list pruning in pnpm-workspace.yaml, then set up pnpm and Node
  with a pnpm cache — the toolchain scaffolding every job repeats. Checkout is
  deliberately NOT here: a local composite action is only readable once the repository is already checked out, so the job that would use
  this action to check itself out has nothing to load it from. Each job runs
  actions/checkout (fetch-depth 0, for GitVersion history and turbo affected) as
  its first step, then calls this.
inputs:
  node-version:
    description: Node major version to install
    required: false
    default: '22'
  registry-url:
    description: npm registry URL — set on publish jobs so pnpm publishes with the right auth
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Turns off exclude-list pruning in this checkout's pnpm-workspace.yaml. A stale
    # exclusion would otherwise be pruned by the job's install, and the next pnpm
    # run or exec would fail on the changed settings. turbo prune copies the file,
    # so a pruned subtree inherits it.
    - name: Turn off exclude-list pruning
      shell: bash
      run: |
        for key in minimumReleaseAgeExcludePrune trustPolicyExcludePrune; do
          if ! grep -Eq "^$key: (true|false)\$" pnpm-workspace.yaml; then
            echo "::error file=pnpm-workspace.yaml::Expected a top-level '$key: true' or '$key: false' line in pnpm-workspace.yaml"
            exit 1
          fi
        done
        sed -e 's/^minimumReleaseAgeExcludePrune: true$/minimumReleaseAgeExcludePrune: false/' \
          -e 's/^trustPolicyExcludePrune: true$/trustPolicyExcludePrune: false/' \
          pnpm-workspace.yaml > pnpm-workspace.yaml.tmp
        mv pnpm-workspace.yaml.tmp pnpm-workspace.yaml

    # Installs the pnpm that packageManager pins. Node comes from setup-node
    # below, and each job runs its own install.
    - uses: pnpm/setup@v3
      with:
        install: false
        node-version-file: false
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm
