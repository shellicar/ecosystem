name: Install GitVersion
description: >
  Install the GitVersion CLI onto the runner PATH. The build-version esbuild
  plugin shells out to `gitversion` at build time, so every job that builds the
  bundle needs it.
inputs:
  platform:
    description: GitVersion release asset platform suffix (e.g. linux-x64, osx-arm64, win-x64)
    required: false
    default: linux-x64
  version:
    description: GitVersion release version
    required: false
    default: '6.6.0'
runs:
  using: composite
  steps:
    - shell: bash
      # Installed under $HOME, owned by the runner user, not root via sudo:
      # a sudo-owned /usr/local/bin binary failed to memory-map when the
      # runner user later tried to execute it (error 13, EACCES).
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "$HOME/.local/bin"
        # TODO(claude): undecided: whether the download prints a line of its own; it prints nothing on success for now.
        gh release download "${{ inputs.version }}" --repo GitTools/GitVersion --pattern "gitversion-${{ inputs.platform }}-${{ inputs.version }}.tar.gz" --output /tmp/gitversion.tar.gz
        tar xzf /tmp/gitversion.tar.gz -C "$HOME/.local/bin" gitversion
        chmod +x "$HOME/.local/bin/gitversion"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

