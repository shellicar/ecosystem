name: Publish

# Publish one already-built package to npm: restore its dist from the build
# artifact, verify its changelog and version, and publish. There is no build
# here — build-package already produced the dist.
on:
  workflow_call:
    inputs:
      package-dir:
        description: Path to the package to publish, relative to the repo root
        required: true
        type: string
      version:
        description: Version from the release tag
        required: true
        type: string
      artifact:
        description: Name of the dist artifact produced by build-package
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org/
      - run: pnpm i --frozen-lockfile

      - name: Restore dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.package-dir }}/dist

      - name: Verify changelog
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
          VERSION: ${{ inputs.version }}
        run: |
          CHANGELOG="$PACKAGE_DIR/CHANGELOG.md"
          if [ ! -f "$CHANGELOG" ]; then
            echo "❌ No CHANGELOG.md found in $PACKAGE_DIR"
            exit 1
          fi
          # Version headings, newest first. [Unreleased] starts with a letter, so it is not one.
          HEADINGS=$(grep -E '^## \[[0-9]' "$CHANGELOG" || true)
          if [ -z "$HEADINGS" ]; then
            echo "❌ No version heading in $CHANGELOG (expected: ## [$VERSION] - YYYY-MM-DD)"
            exit 1
          fi
          # The version is matched as text, so its dots and hyphens match only themselves.
          FIRST=$(printf '%s\n' "$HEADINGS" | head -n1)
          case "$FIRST" in
            "## [$VERSION] - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            "## [$VERSION]"*)
              echo "❌ Entry ## [$VERSION] is missing a date (expected: ## [$VERSION] - YYYY-MM-DD)"
              exit 1
              ;;
            *)
              echo "❌ First changelog entry \"$FIRST\" does not match release version [$VERSION]"
              exit 1
              ;;
          esac
          # A stable release fails while a pre-release heading remains below it, down to the previous stable heading.
          case "$VERSION" in
            *-*) ;;
            *)
              for V in $(printf '%s\n' "$HEADINGS" | tail -n +2 | sed -E 's/^## \[([^]]*)\].*/\1/'); do
                case "$V" in
                  *-*)
                    echo "❌ Pre-release heading [$V] remains below [$VERSION]: remove its release marker so its entries fall under [$VERSION]"
                    exit 1
                    ;;
                  *) break ;;
                esac
              done
              ;;
          esac
          echo "✅ Changelog OK"

      - uses: ./.github/actions/publish-package
        with:
          package-dir: ${{ inputs.package-dir }}
          version: ${{ inputs.version }}
